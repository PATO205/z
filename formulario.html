<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario IMC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Registro de Datos</h2>
        <form action="insertar.php" method="POST">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="sexo">Sexo:</label>
            <select id="sexo" name="sexo" required>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
            </select>

            <label for="semestre">Semestre:</label>
            <input type="number" id="semestre" name="semestre" min="1" max="12" required>

            <label for="grupo">Grupo:</label>
            <input type="text" id="grupo" name="grupo" required>

            <label for="ta">TA:</label>
            <input type="text" id="ta" name="ta" required>

            <label for="temperatura">Temperatura:</label>
            <input type="number" step="0.1" id="temperatura" name="temperatura" required>

            <label for="fc">FC:</label>
            <input type="number" id="fc" name="fc" required>

            <label for="fr">FR:</label>
            <input type="number" id="fr" name="fr" required>

            <label for="saturacion">Saturación:</label>
            <input type="number" step="0.1" id="saturacion" name="saturacion" required>

            <label for="peso">Peso (kg):</label>
            <input type="number" step="0.1" id="peso" name="peso" required>

            <label for="talla">Talla (m):</label>
            <input type="number" step="0.01" id="talla" name="talla" required>

            <button type="submit">Insertar</button>
        </form>
    </div>
</body>
</html>
